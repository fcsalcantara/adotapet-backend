# DevTools do Spring:
spring.devtools.add-properties=true

# Configuracoes de banco de dados:
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/adotapet
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.org.hibernate.type=trace
logging.level.org.hibernate.stat=debug

# Uso de SSL no servidor:
server.ssl.key-alias=dev-ssl-key-adotapet-backend

# JWT, assinando tokens com par de chaves RSA:
# *Expiracao do token definida em 45 minutos.
adotapet.jwt.expiracao-milisegundos=2700000
adotapet.jwt.key-alias=dev-jwt-key-adotapet-backend
adotapet.jwt.key-password=x49DErj2Lc9Gdt4DE57t6yQY

# Autenticacao de acesso ao servico:
adotapet.api.nome-acesso=username@estacio.br
adotapet.api.senha-acesso=adota@local

# Autenticacao para o usuario do Swagger:
adotapet.api.swagger.nome-acesso=swagger@estacio.br
adotapet.api.swagger.senha-acesso=adota@local
